<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tender Discovery Tool</title>
<link rel="stylesheet" href="/page/app.css">
</head>
<body>
<header id="header">
  <div class="header-left">
    <div class="brand"><span class="logo">T</span>Tender Discovery Tool</div>
    <div class="doc-ref">
      <span id="doc-ref"></span>
      <span id="status-pill" class="pill" hidden></span>
      <span id="confidence" class="conf" hidden title="confidence score from §2"></span>
      <span id="analyze-progress" class="pill" hidden title="the automatic analyze chain: chunks queued or running against items still needing work"></span>
    </div>
  </div>
  <div class="header-right">
    <label class="switch" title="Annotate mode: click any block to attach a note for the agent (shortcut: A, Esc to leave)">
      <input type="checkbox" id="annotate-toggle">
      <span class="track"><span class="knob"></span></span>
      <span class="switch-label">Annotate</span>
    </label>
    <span id="queued-badge" class="badge muted" hidden title="direct writes waiting for the current run to end - separate from the Agent card's queued annotations/chat"></span>
    <span id="status-dot" class="dot" title="session status"></span>
    <span id="status-text" class="muted">connecting…</span>
    <button id="profile-btn" class="btn subtle" title="Open the partner profile wizard">Profile</button>
    <button id="reconcile-btn" class="btn" title="Ask the skill to re-estimate the items an answered question or profile change marked">Re-estimate</button>
    <button id="export-btn" class="btn primary" title="Export the current working sheets — available anytime; unconfirmed items export with empty answer cells">Export</button>
    <button id="stop-btn" class="btn subtle" title="End the editor session">Stop session</button>
  </div>
</header>
<div id="banners"></div>
<main id="layout">
  <section id="doc" class="doc"></section>
  <aside id="panel">
    <div class="panel-block" id="chat-panel">
      <div class="panel-head">
        <h2>Agent</h2>
        <span id="agent-state" class="agent-state"></span>
        <button id="panel-fold" class="btn subtle" type="button" title="Fold the agent panel to give the working sheets more room">&gt;</button>
      </div>
      <section id="queued" class="queued" hidden aria-label="Queued items">
        <div class="q-head">
          <button id="queued-toggle" class="q-toggle" type="button" aria-expanded="true" aria-controls="queued-list">
            <span class="caret" aria-hidden="true"></span>Queued <span id="queued-count" class="count"></span>
          </button>
          <button id="queued-clear" class="btn subtle" type="button" title="Remove every queued item">Clear</button>
        </div>
        <div id="queued-list" class="q-list"></div>
      </section>
      <div id="chat" class="chat"></div>
      <div class="chat-input">
        <textarea id="chat-text" rows="2" placeholder="Ask or instruct the agent, or click blocks in Annotate mode to queue notes… (Enter to send, Shift+Enter for a new line)"></textarea>
        <button id="chat-send" class="btn" disabled>Send</button>
      </div>
    </div>
  </aside>
  <div id="panel-rail" class="panel-rail" hidden>
    <button id="panel-unfold" class="btn subtle" type="button" title="Reopen the agent panel">&lt;</button>
    <span id="rail-badge" class="badge muted" hidden></span>
    <span id="rail-dot" class="dot" hidden title="agent working"></span>
  </div>
</main>
<div id="note-popover" class="popover" role="dialog" aria-label="Note for the agent" hidden>
  <div class="arrow"></div>
  <div class="ne-ctx"></div>
  <div class="ne-sel" hidden></div>
  <textarea rows="3" placeholder="Comment for the agent — what should change here?"></textarea>
  <div class="row">
    <button class="btn primary save">Add note</button>
    <button class="btn subtle cancel">Cancel</button>
    <span class="spacer"></span>
    <button class="btn subtle delete" hidden>Delete note</button>
    <span class="hint">⌘/Ctrl+Enter</span>
  </div>
</div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="/page/vendor/marked.min.js"></script>
<script type="module" src="/page/app.js"></script>
</body>
</html>
